<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');

  :root {
    --teal: #0F6E56;
    --teal-light: #5DCAA5;
    --pink: #E91E8C;
    --purple: #4A2D6B;
    --ocean1: #0A4F6B;
    --ocean2: #1A7A9A;
    --ocean3: #2AAAC9;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height: 100%;
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(180deg, #0A4F6B 0%, #1A7A9A 40%, #2AAAC9 70%, #5DCAA5 100%);
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    position: relative;
  }

  .bubble { position:absolute; border-radius:50%; background:rgba(255,255,255,0.06); animation: float 6s ease-in-out infinite; }
  .bubble:nth-child(1){width:90px;height:90px;top:8%;left:6%;animation-delay:0s;}
  .bubble:nth-child(2){width:50px;height:50px;top:75%;right:10%;animation-delay:1s;}
  .bubble:nth-child(3){width:130px;height:130px;bottom:10%;left:0%;animation-delay:2s;}
  @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-18px);} }

  .counter {
    position: fixed;
    top: 14px; right: 14px;
    background: rgba(74,45,107,0.85);
    color: white;
    font-family: 'Fredoka One', sans-serif;
    font-size: 0.85rem;
    padding: 6px 14px;
    border-radius: 20px;
    z-index: 10;
  }

  .card {
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 26px;
    padding: 2rem 1.6rem;
    width: 100%;
    max-width: 420px;
    text-align: center;
    z-index: 1;
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  }

  .logo-img {
    width: 92px; height: 92px;
    border-radius: 50%;
    margin-bottom: 0.6rem;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    border: 3px solid rgba(255,255,255,0.4);
  }
  h1 {
    font-family: 'Fredoka One', sans-serif;
    color: white;
    font-size: 1.7rem;
    line-height: 1.25;
    margin-bottom: 0.5rem;
    text-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  h1 span { color: var(--pink); }
  .sub {
    color: #E8F7F0;
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 1.6rem;
  }

  input[type="email"] {
    width: 100%;
    padding: 16px 18px;
    border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.9);
    color: var(--purple);
    font-size: 1.15rem;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    outline: none;
    text-align: center;
    margin-bottom: 14px;
  }
  input[type="email"]::placeholder { color: #9B6B9B; font-weight: 600; }

  .unlock-btn {
    width: 100%;
    background: var(--pink);
    color: white;
    font-family: 'Fredoka One', sans-serif;
    font-size: 1.3rem;
    padding: 16px;
    border-radius: 18px;
    border: none;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(233,30,140,0.45);
    transition: transform 0.15s;
  }
  .unlock-btn:active { transform: scale(0.97); }
  .unlock-btn:disabled { opacity: 0.6; }

  .error-msg {
    color: #FFD8EC;
    font-weight: 700;
    font-size: 0.9rem;
    margin-top: 10px;
    min-height: 20px;
  }

  /* ── SUCCESS / QR SCREEN ── */
  .success-screen { display: none; }
  .success-screen.active { display: block; }
  .form-screen.hidden { display: none; }

  .unlocked-badge {
    font-family: 'Fredoka One', sans-serif;
    color: var(--gold, #FFD700);
    font-size: 1.1rem;
    margin-bottom: 6px;
    letter-spacing: 0.03em;
  }
  .qr-wrap {
    background: white;
    border-radius: 20px;
    padding: 16px;
    margin: 16px auto;
    width: fit-content;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .qr-wrap img { display: block; width: 220px; height: 220px; }
  .scan-hint {
    color: white;
    font-family: 'Fredoka One', sans-serif;
    font-size: 1.15rem;
    margin-bottom: 4px;
  }
  .scan-sub {
    color: #E8F7F0;
    font-size: 0.92rem;
    font-weight: 600;
    margin-bottom: 20px;
    line-height: 1.4;
  }
  .next-btn {
    width: 100%;
    background: rgba(255,255,255,0.18);
    color: white;
    border: 2px solid rgba(255,255,255,0.3);
    font-family: 'Fredoka One', sans-serif;
    font-size: 1.05rem;
    padding: 13px;
    border-radius: 16px;
    cursor: pointer;
  }
</style>
</head>

  try {

  } catch(e) {}
  updateCounter();

  function updateCounter() {
    document.getElementById('counterBadge').textContent =
      signupCount + (signupCount === 1 ? ' signed up today' : ' signed up today');
  }

  function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  function postToHiddenIframe(actionUrl, fields) {
    const frameName = 'captureFrame_' + Math.random().toString(36).slice(2);
    const iframe = document.createElement('iframe');
    iframe.name = frameName;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = actionUrl;
    form.target = frameName;
    form.style.display = 'none';
    Object.keys(fields).forEach(key => {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = key;
      input.value = fields[key];
      form.appendChild(input);
    });
    document.body.appendChild(form);
    form.submit();
    setTimeout(() => { form.remove(); iframe.remove(); }, 2000);
  }

  function handleUnlock() {
    const emailInput = document.getElementById('emailInput');
    const errorMsg = document.getElementById('errorMsg');
    const email = emailInput.value.trim();

    if (!isValidEmail(email)) {
      errorMsg.textContent = 'Please enter a valid email address';
      emailInput.focus();
      return;
    }
    errorMsg.textContent = '';

    // Send to Kit in the background
    postToHiddenIframe(`https://api.convertkit.com/v3/forms/${KIT_FORM_ID}/subscribe`, {
      api_key: KIT_PUBLIC_API_KEY,
      email: email
    });

    // Build the QR code for the live app link
    document.getElementById('qrImage').src = QR_CODE_DATA_URI;

    // Track count
    signupCount++;
    try { sessionStorage.setItem('kioskSignupCount', String(signupCount)); } catch(e) {}
    updateCounter();

    // Switch screens
    document.getElementById('formScreen').classList.add('hidden');
    document.getElementById('successScreen').classList.add('active');
  }

  function resetKiosk() {
    document.getElementById('emailInput').value = '';
    document.getElementById('errorMsg').textContent = '';
    document.getElementById('successScreen').classList.remove('active');
    document.getElementById('formScreen').classList.remove('hidden');
    document.getElementById('emailInput').focus();
  }

  // Allow Enter key to submit
  document.getElementById('emailInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleUnlock();
  });
